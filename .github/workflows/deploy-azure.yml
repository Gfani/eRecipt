name: CI/CD Pipeline - Build, Test & Validate

on:
  push:
    branches:
      - main
      - Fani
    paths-ignore:
      - '**.md'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: ci-pipeline
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Test & Validate Code (CI)
  # ----------------------------------------------------------------------------
  validate:
    name: Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Build & Validate Backend
        run: |
          cd Backend
          npm ci
          npm run build

      - name: Build & Validate Frontend
        run: |
          cd Frontend/ereceipt
          npm ci
          npm run build

  # ----------------------------------------------------------------------------
  # Job 2: Render Deployment Status (CD)
  # Deployment is managed automatically by Render via render.yaml blueprint.
  # If RENDER_DEPLOY_HOOK_URL is configured in GitHub secrets, trigger it here.
  # ----------------------------------------------------------------------------
  deploy-render:
    name: Notify Render Deployment
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Fani'
    steps:
      - name: Trigger Render Deploy Hook (Optional)
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Render deployment hook..."
            curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "Render webhook triggered successfully."
          else
            echo "Render is configured to automatically deploy from GitHub pushes via render.yaml."
          fi
